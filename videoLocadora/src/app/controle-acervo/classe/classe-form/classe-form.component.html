<!-- Formulario -->
<section class="container mb-4 mt-5">
    <div class="card container">
        <div class="card-body">
            <h5 class="card-title">Adicionar Ator</h5>
            <form [formGroup]="form">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" class="form-control" formControlName="nome" pattern="^[A-Za-zÀ-ÿ\s]+$"
                        title="Apenas letras são permitidas." minlength="3" maxlength="150" required />
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="valor" class="form-label">Valor:</label>
                        <input type="number" class="form-control" formControlName="valor" step="0.01" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="dataDeDevolucao" class="form-label">Data de Devolução:</label>
                        <input type="date" class="form-control" formControlName="dataDeDevolucao" required>
                    </div>
                </div>
                <div class="d-flex justify-content-center mt-3">
                    <button (click)="onSubmit()" class="btn btn-primary mx-2" [disabled]="form.invalid">Inserir</button>
                    <button (click)="onCancel()" class="btn btn-secondary mx-2">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</section>
