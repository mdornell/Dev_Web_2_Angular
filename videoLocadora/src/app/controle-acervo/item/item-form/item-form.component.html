<!-- Formulario -->
<section class="container mb-4 mt-5">
    <div class="card container">
        <div class="card-body">
            <h5 class="card-title">Adicionar Ator</h5>
            <form [formGroup]="form">
                <div class="mb-3">
                    <label for="numSerie" class="form-label">Nº de Serie :</label>
                    <input type="number" class="form-control" formControlName="numSerie" required />
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="dtAquisicao" class="form-label">Data de Aquisição :</label>
                        <input type="date" class="form-control" formControlName="dtAquisicao" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="tipoItem" class="form-label">Tipo :</label>
                        <input type="text" class="form-control" formControlName="tipoItem" required>
                    </div>
                    <!-- Campo Item -->
                    <div class="col">
                        <label for="titulos" class="form-label">Titulos:</label>
                        <select class="form-control" formControlName="titulos" required>
                            <option value="" selected>Selecione uma Titulo...</option>
                            <option *ngFor="let titulo of titulos$ | async" [ngValue]="titulo._id">{{ titulo.nome }}
                            </option>
                        </select>
                    </div>

                </div>
                <div class="d-flex justify-content-center mt-3">
                    <button (click)="onSubmit()" class="btn btn-primary mx-2" [disabled]="form.invalid">Inserir</button>
                    <button (click)="onCancel()" class="btn btn-secondary mx-2">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</section>
