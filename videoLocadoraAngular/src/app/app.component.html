<header>
    <mat-toolbar color="primary" class="d-flex justify-content-between align-items-center">
        <!-- Botão de menu usando Angular Material -->
        <button mat-icon-button [matMenuTriggerFor]="appMenu" class="btn btn-dark">
            <mat-icon class="mt-1">more_vert</mat-icon>
        </button>

        <mat-menu #appMenu="matMenu">
            <button mat-menu-item>Diretor</button>
            <button mat-menu-item>Classe</button>
        </mat-menu>

        <!-- Centralizar o título com Bootstrap -->
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <h1 class="text-center text-white">Video Locadora</h1>
                </div>
            </div>
        </div>
    </mat-toolbar>
</header>

<main>
    <!-- Formulario -->
    <section class="container mb-4 mt-5">
        <div class="card container">
            <div class="card-body">
                <h5 class="card-title">Adicionar Ator</h5>
                <form [formGroup]="form">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome:</label>
                        <input type="text" class="form-control" formControlName="nome" required>
                    </div>
                    <button (click)="salvar()" class="btn btn-primary">Inserir</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Tabela -->
    <section class="container mt-5">
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Maria Oliveira</td>
                        <td>
                            <button class="btn btn-primary btn-sm">Editar</button>
                            <button class="btn btn-danger btn-sm">Excluir</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer>

</footer>
