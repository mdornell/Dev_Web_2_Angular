<!-- Formulario -->
<section class="container mb-4 mt-5">
    <div class="card container">
        <div class="card-body">
            <h5 class="card-title">Adicionar Ator</h5>
            <form [formGroup]="form">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" class="form-control" formControlName="nome" required>
                </div>
                <button (click)="salvar()" class="btn btn-primary">Inserir</button>
            </form>
        </div>
    </div>
</section>

<section class="container mt-5">
    <div class="mat-elevation-z8 table-responsive">
        <table mat-table [dataSource]="atores" class="mat-table" matSort>

            <!-- Id Column -->
            <ng-container matColumnDef="_id">
                <th mat-header-cell *matHeaderCellDef class="table-dark"> ID </th>
                <td mat-cell *matCellDef="let element"> {{element._id}} </td>
            </ng-container>

            <!-- Nome Column -->
            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef class="table-dark"> Nome </th>
                <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
            </ng-container>

            <!-- Ações Column -->
            <ng-container matColumnDef="acoes">
                <th mat-header-cell *matHeaderCellDef class="table-dark"> Ações </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-raised-button color="primary" class="btn-sm">Editar</button>
                    <button mat-raised-button color="warn" class="btn-sm">Excluir</button>
                </td>
            </ng-container>

            <!-- Header and Row Declarations -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</section>
