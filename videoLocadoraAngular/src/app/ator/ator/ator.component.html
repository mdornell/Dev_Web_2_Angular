<!-- Tabela -->
<section class="container mt-5">
    <div class="table-responsive shadow-sm">
        <div class="card card-body mb-2">
            <h3 class="text-center fw-bold text-uppercase">Gestão de Atores</h3>
        </div>
        <div class="card">
            <div *ngIf="atores$ | async as atores; else loading">
                <table class="table table-bordered">
                    <!-- Table Header -->
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" class="col-10">Nome</th>
                            <th scope="col" class=" text-center">
                                <button class="btn btn-sm btn-success" (click)="onAdd()" aria-label="Adicionar um Ator">
                                    <i class="bi bi-plus"></i>
                                </button>
                            </th>
                        </tr>
                    </thead>

                    <!-- Table Body -->
                    <tbody>
                        <tr *ngFor="let element of atores">
                            
                            <!-- Nome Column -->
                            <td class="col-10">{{element.nome}}</td>

                            <!-- Ações Column -->
                            <td class="d-flex justify-content-center gap-1">
                                <button class="btn btn-sm btn-primary" (click)="onEdit(element)" aria-label="Editar um Ator">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <button class="btn btn-sm btn-danger ml-2" (click)="openDeleteModal(element._id)" aria-label="Remover um Ator" data-bs-toggle="modal" data-bs-target="#deleteModal">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                            
                        </tr>
                    </tbody>
                </table>
            </div>
            <ng-template #loading>
                <div class="d-flex justify-content-center mt-3 mb-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="sr-only">Carregando...</span>
                    </div>
                </div>
            </ng-template>
        </div>
    </div>

    <!-- Modal de Confirmação -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmDeleteModalLabel">Confirmação de Exclusão</h5>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja excluir este ator?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" (click)="onDelete()">Excluir</button>
                </div>
            </div>
        </div>
    </div>

</section>
